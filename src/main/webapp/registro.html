```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresar | Academia Lobos</title>

    <!-- Estilos de la pantalla de acceso -->
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

    <!-- Contenedor principal -->
    <main class="contenedor-login">

        <!-- Tarjeta de inicio de sesión -->
        <section class="tarjeta-login">

            <header class="encabezado">
                <h1>Academia Lobos</h1>
                <p>Sistema de administración</p>
            </header>

            <h2>Iniciar sesión</h2>

            <p class="descripcion">
                Ingresa tus datos para continuar.
            </p>

            <!--
                El formulario no crea usuarios ni guarda contraseñas.
                JavaScript solamente comprobará que los dos campos
                estén completos antes de permitir el acceso.
            -->
            <form id="formLogin">

                <div class="grupo-formulario">
                    <label for="boleta">Número de boleta</label>

                    <input
                        type="text"
                        id="boleta"
                        name="boleta"
                        placeholder="Ingresa tu número de boleta"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Mensaje de validación -->
                <p id="mensajeError" class="mensaje-error"
                   role="alert" aria-live="polite"></p>

                <button type="submit" class="boton-principal">
                    Ingresar
                </button>

            </form>

            <footer class="pie-login">
                Academia Lobos · Sistema interno
            </footer>

        </section>

    </main>

    <!-- Lógica de validación -->
    <script src="js/registro.js"></script>
</body>
</html>
```
