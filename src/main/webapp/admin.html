<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador | Academia Lobos</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <!-- =========================================
         CONTENEDOR PRINCIPAL
    ========================================== -->

    <div id="app">

        <!-- HEADER -->
        <header class="admin-header">

            <div class="logo-area">
                <a href="#dashboard" class="logo-link">
                    <img
                        src="assets/logo-academia-lobos-trans.png"
                        alt="Academia Lobos"
                        class="admin-logo">
                </a>
            </div>

            <!-- Botón móvil -->
            <button id="menuToggle" class="menu-toggle">
                ☰
            </button>

            <!-- NAVEGACIÓN -->
            <nav id="mainNav" class="main-nav">

                <a href="#alumnos" data-route="alumnos">
                    Alumnos
                </a>

                <a href="#personal" data-route="personal">
                    Personal
                </a>

                <a href="#finanzas" data-route="finanzas">
                    Finanzas
                </a>

                <a href="#equipos" data-route="equipos">
                    Equipos
                </a>

                <a href="#calendario" data-route="calendario">
                    Calendario
                </a>

                <a href="#documentos" data-route="documentos">
                    Documentos
                </a>

                <a href="#uniformes" data-route="uniformes">
                    Uniformes
                </a>

            </nav>

            <div class="admin-user">
                <span class="admin-dot"></span>
                <span>Administrador</span>
            </div>

        </header>


        <!-- =========================================
             CONTENIDO DINÁMICO
        ========================================== -->

        <main id="appContent" class="app-content">
            <!-- El contenido se genera mediante admin.js -->
        </main>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="admin-footer">

            <div>
                <strong>Academia Lobos</strong>
            </div>

            <div>
                <span>Contáctanos</span>
            </div>

        </footer>

    </div>


    <!-- JAVASCRIPT -->
    <script src="js/admin.js"></script>

</body>
</html>
